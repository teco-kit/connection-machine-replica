<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>CM2-Display-Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    @font-face {
      font-family: 'Orbitron';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('orbitron.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>CM2-Display-Control</h1>
      <div id="status">Connecting...</div>
    </div>
    
    <div class="workload-label">
      Adjust Workload:
      <div class="controls">
        <input type="range" id="probabilitySlider" min="0" max="100" value="33" step="1">
        <span id="probabilityValue">33%</span>
      </div>
    </div>
    
    <div class="speed-label">
      Adjust Speed:
      <div class="controls">
        <input type="range" id="speedSlider" min="50" max="500" value="150" step="10">
        <span id="speedValue">150ms</span>
      </div>
    </div>
    
    <div class="display" id="display">
      <div class="instruction">
        Draw on the Connection Machine below:
      </div>
      <div class="cube-grid" id="cube-grid">
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
