<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Connection Machine 2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    @font-face {
      font-family: 'Orbitron';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('orbitron.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Connection Machine 2</h1>
      <div id="status">Connecting...</div>
    </div>

    <div class="display" id="display">
      <div class="toolbar" id="toolbar">
        <div class="program-selector" id="programSelector">
          <button class="action-btn idle" id="idleBtn">Idle</button>
          <select id="programSelect"></select>
          <button class="action-btn run" id="runBtn">Run</button>
        </div>
        <div class="workload-label">
          Idle Workload:
          <div class="controls">
            <input type="range" id="probabilitySlider" min="0" max="100" value="33" step="1">
            <span id="probabilityValue">33%</span>
          </div>
        </div>
        <div class="speed-label">
          Idle Speed:
          <div class="controls">
            <input type="range" id="speedSlider" min="50" max="500" value="150" step="10">
            <span id="speedValue">150ms</span>
          </div>
        </div>
      </div>
      <div class="grid-area">
        <div class="instruction">
          Draw on the CM2 with your finger below:
        </div>
        <div class="cube-grid" id="cube-grid">
        </div>
      </div>
    </div>

    <div class="snake-controls" id="snakeControls" style="display:none;">
      <div class="snake-score">Score: <span id="snakeScore">0</span></div>
      <div class="dpad">
        <button class="dpad-btn up" id="btnUp">&#9650;</button>
        <div class="dpad-row">
          <button class="dpad-btn left" id="btnLeft">&#9664;</button>
          <button class="dpad-btn right" id="btnRight">&#9654;</button>
        </div>
        <button class="dpad-btn down" id="btnDown">&#9660;</button>
      </div>
      <div class="snake-hint">Use buttons or swipe to steer</div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
